---
- name: Setup RepoServer
  hosts: rhce-control
  tasks:
    - name: install vsftpd
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: latest
      loop:
        - vsftpd
        - firewalld
    - name: configure for anonymous access
      ansible.builtin.copy:
        src: files/vsftpd.conf
        dest: /etc/vsftpd/vsftpd.conf

    - name: mount the dvd
      ansible.posix.mount:
        path: /var/ftp/repo
        src: /dev/sr0
        fstype: iso9660
        opts: ro,auto
        state: mounted

    - name: set sebool fullaccess
      ansible.posix.seboolean:
        name: ftpd_full_access
        persistent: true
        state: on

    - name: start the services
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - vsftpd
        - firewalld

    - name: allow ftp thru the fw
      ansible.builtin.firewalld:
       service: ftp
       state: enabled
       immediate: true
       permanent: true
       

